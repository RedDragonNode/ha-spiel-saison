[tool.pytest.ini_options]
testpaths = ["tests", "spiel_saison_recorder/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "RUF001",  # deutsche Texte in Strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"spiel_saison_recorder/**" = [
  "E501",  # übernommener, bewährter App-Code
  "E741",
  "SIM105",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
