name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # bleibt das Installieren von ffmpeg hängen, bricht der Lauf ab statt endlos zu laufen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 update && sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 install -y ffmpeg
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
